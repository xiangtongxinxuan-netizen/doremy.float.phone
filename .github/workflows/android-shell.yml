name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "留空使用 https://xfloat.netlify.app/，或填写完全相同的地址"
        required: false
        type: string
  push:
    branches: [main, feature/life-system, feature/life-system-mainline, codex/dear-leon-1.1.0-full]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml", "scripts/check-android-permissions.mjs", "!android-shell/**/*.md"]
  pull_request:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml", "scripts/check-android-permissions.mjs", "!android-shell/**/*.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL || 'https://xfloat.netlify.app/' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved Shell site URL
        shell: bash
        run: |
          if [[ "$SHELL_SITE_URL" != 'https://xfloat.netlify.app/' ]]; then
            echo "::error::SHELL_SITE_URL must exactly match https://xfloat.netlify.app/"
            exit 1
          fi

      - name: Check Android permission baseline and version parity
        run: node scripts/check-android-permissions.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP 8.9.1 requires Gradle 8.11.1+. Health Connect 1.1.0 also
      # requires compileSdk 36; keep this toolchain paired with android-shell/build.gradle.
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"

      - name: Build and verify signed Release and Debug APKs
        shell: bash
        env:
          SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret in SHELL_KEYSTORE_BASE64 SHELL_KEYSTORE_PASSWORD SHELL_KEY_ALIAS SHELL_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing required Release signing secret: $secret"
              exit 1
            fi
          done

          umask 077
          SHELL_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/dear-leon-release.XXXXXX")"
          export SHELL_KEYSTORE_FILE
          trap 'rm -f -- "$SHELL_KEYSTORE_FILE"' EXIT

          if ! printf '%s' "$SHELL_KEYSTORE_BASE64" | base64 --decode > "$SHELL_KEYSTORE_FILE"; then
            echo "::error::Could not decode the Release keystore"
            exit 1
          fi
          if [[ ! -s "$SHELL_KEYSTORE_FILE" ]]; then
            echo "::error::Release keystore is missing or empty"
            exit 1
          fi
          unset SHELL_KEYSTORE_BASE64

          gradle -p android-shell assembleRelease assembleDebug

          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::Android apksigner was not found"
            exit 1
          fi

          RELEASE_APK="android-shell/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android-shell/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$RELEASE_APK"
          test -s "$DEBUG_APK"
          "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
          "$APKSIGNER" verify --verbose --print-certs "$DEBUG_APK"

      - name: Upload verified Dear Leon Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dear-leon-release
          path: android-shell/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
