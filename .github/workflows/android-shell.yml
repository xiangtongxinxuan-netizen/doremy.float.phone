name: Build Android Shell APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "留空使用仓库变量，或填写 https://xfloat.netlify.app/"
        required: false
        type: string
  push:
    branches: [main]
    paths: ["android-shell/**", ".github/workflows/android-shell.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHELL_SITE_URL: ${{ inputs.site_url || vars.SHELL_SITE_URL }}
    steps:
      - name: Validate Shell site URL
        shell: bash
        run: |
          if [[ "$SHELL_SITE_URL" != 'https://xfloat.netlify.app/' ]]; then
            echo "::error::SHELL_SITE_URL must exactly match the approved HTTPS URL: https://xfloat.netlify.app/"
            exit 1
          fi
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build signed Release APK
        shell: bash
        env:
          SHELL_KEYSTORE_BASE64: ${{ secrets.SHELL_KEYSTORE_BASE64 }}
          SHELL_KEYSTORE_PASSWORD: ${{ secrets.SHELL_KEYSTORE_PASSWORD }}
          SHELL_KEY_ALIAS: ${{ secrets.SHELL_KEY_ALIAS }}
          SHELL_KEY_PASSWORD: ${{ secrets.SHELL_KEY_PASSWORD }}
        run: |
          for secret in SHELL_KEYSTORE_BASE64 SHELL_KEYSTORE_PASSWORD SHELL_KEY_ALIAS SHELL_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing required Release signing secret: $secret"
              exit 1
            fi
          done

          umask 077
          SHELL_KEYSTORE_FILE="$(mktemp "$RUNNER_TEMP/dear-leon-release.XXXXXX")"
          export SHELL_KEYSTORE_FILE
          trap 'rm -f -- "$SHELL_KEYSTORE_FILE"' EXIT
          if ! printf '%s' "$SHELL_KEYSTORE_BASE64" | base64 --decode > "$SHELL_KEYSTORE_FILE"; then
            echo "::error::Could not decode the Release keystore"
            exit 1
          fi
          if [[ ! -f "$SHELL_KEYSTORE_FILE" || ! -s "$SHELL_KEYSTORE_FILE" ]]; then
            echo "::error::Release keystore is missing or empty"
            exit 1
          fi
          unset SHELL_KEYSTORE_BASE64
          gradle -p android-shell assembleRelease

      - name: Verify Release APK signature
        shell: bash
        run: |
          apk=android-shell/app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" || ! -s "$apk" ]]; then
            echo "::error::Expected signed Release APK is missing or empty"
            exit 1
          fi
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$sdk_root/build-tools/34.0.0/apksigner"
          if [[ ! -x "$apksigner" ]]; then
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          fi
          "$apksigner" verify --verbose --print-certs "$apk"

      - name: Upload verified Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dear-leon-release
          path: android-shell/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build Debug APK
        run: gradle -p android-shell assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: float-shell-debug
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
