name: MUSIC-02 Validation

on:
  push:
    branches:
      - codex/music-02-media-observer
      - codex/music-02-media-observer-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHELL_SITE_URL: https://xfloat.netlify.app/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Check branch diff
        shell: bash
        run: |
          git diff --check 1dda06412d2fdadb7c9c29f025f54ad27e15a558 HEAD

      - name: Test TypeScript bridge
        run: node --test lib/native-music-bridge.test.ts

      - name: Test Kotlin
        shell: bash
        run: |
          set +e
          gradle -p android-shell testDebugUnitTest --stacktrace --console=plain 2>&1 | tee kotlin-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            summary="$(grep -E '(^e: |error:|FAILURE:|What went wrong|Execution failed|Manifest merger failed)' kotlin-test.log | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')"
            echo "::error title=Kotlin test failure::${summary:-Gradle test failed; see job log}"
            exit "$status"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          gradle -p android-shell assembleDebug --stacktrace --console=plain 2>&1 | tee debug-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            summary="$(grep -E '(^e: |error:|FAILURE:|What went wrong|Execution failed|Manifest merger failed)' debug-build.log | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')"
            echo "::error title=Debug build failure::${summary:-Gradle build failed; see job log}"
            exit "$status"
          fi

      - name: Verify isolated Debug identity
        shell: bash
        run: |
          apk="android-shell/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$aapt" -a -x "$aapt"
          badging="$($aapt dump badging "$apk")"
          grep -Fq "package: name='app.floatphone.shell.music02test'" <<<"$badging"
          grep -Fq "application-label:'dear Leon MUSIC-02 Test'" <<<"$badging"
          grep -Fq 'applicationId "app.floatphone.shell"' android-shell/app/build.gradle
          grep -Fq 'applicationIdSuffix ".music02test"' android-shell/app/build.gradle

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-02-isolated-debug-apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
