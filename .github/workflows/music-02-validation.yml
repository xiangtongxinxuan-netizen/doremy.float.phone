name: MUSIC-02 Validation

on:
  push:
    branches:
      - codex/music-02-media-observer
      - codex/music-02-media-observer-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHELL_SITE_URL: https://xfloat.netlify.app/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Check branch diff
        shell: bash
        run: |
          git diff --check 1dda06412d2fdadb7c9c29f025f54ad27e15a558 HEAD

      - name: Test TypeScript bridge
        run: node --test lib/native-music-bridge.test.ts

      - name: Test Kotlin and build Debug APK
        run: gradle -p android-shell testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-02-debug-apk
          path: android-shell/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
